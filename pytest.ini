[pytest]
testpaths = tests
addopts = -m "not performance and not qt_native_inner" --basetemp=.test-artifacts/pytest-tmp
cache_dir = .test-artifacts/pytest-cache
markers =
    performance: opt-in large-dataset performance benchmark
    qt_native_inner: Qt/native stress body that must run inside the subprocess release gate
norecursedirs =
    dist
    build
    .pytest_cache
    .test-artifacts
    __pycache__
    performance_reports
    pytest_manual_full_*
    Backup
    .codex-backups
    .codex_pytest_tmp
    .pytest_tmp*
    quant_collector_app/data
    quant_collector_app/logs
