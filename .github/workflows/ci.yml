name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONPATH: .;quant_collector_app
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall quant_collector_app scripts
      - name: Run tests
        shell: pwsh
        run: |
          $baseTemp = Join-Path $env:RUNNER_TEMP "qrc-pytest-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cacheDir = Join-Path $env:RUNNER_TEMP "qrc-pytest-cache-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $outputPath = Join-Path $env:RUNNER_TEMP "qrc-pytest-output-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.log"
          python -m pytest -q --basetemp $baseTemp -o "cache_dir=$cacheDir" --junitxml=pytest-results.xml 2>&1 |
            Tee-Object -FilePath $outputPath
          exit $LASTEXITCODE
      - name: Report test failures
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath pytest-results.xml) {
            [xml]$report = Get-Content -LiteralPath pytest-results.xml -Raw
            foreach ($case in $report.SelectNodes('//testcase[failure or error]')) {
              $failure = if ($case.failure) { $case.failure } else { $case.error }
              $message = "$($case.classname)::$($case.name): $($failure.message)"
              $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Pytest failure::$escaped"
            }
          } else {
            $outputPath = Join-Path $env:RUNNER_TEMP "qrc-pytest-output-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.log"
            $message = (Get-Content -LiteralPath $outputPath -Tail 120) -join "`n"
            $escaped = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Pytest output::$escaped"
          }
      - name: Run core self check
        run: python quant_collector_app/self_check.py --core
      - name: Build clean release
        run: python scripts/clean_release.py --output dist/QuantReplayCollector-Clean
      - name: Verify clean release content
        run: python scripts/check_release_clean.py dist/QuantReplayCollector-Clean
      - name: Upload clean release artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantReplayCollector-Clean
          path: dist/QuantReplayCollector-Clean
          if-no-files-found: error
